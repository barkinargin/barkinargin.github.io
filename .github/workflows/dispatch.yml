name: Morning Dispatch

on:
  schedule:
    # 13:44 UTC = 5:44 AM Pacific in winter (6:44 AM in summer)
    - cron: "44 13 * * *"
  workflow_dispatch: {}   # "Run workflow" button for a manual edition
  push:
    branches: [main]      # redeploy the site whenever you change it

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write today's edition
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: add it to get Claude-written summaries
          DISPATCH_MODEL: ${{ vars.DISPATCH_MODEL }}            # optional: override the model
        run: python scripts/build_dispatch.py

      - name: Save the edition to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "dispatch-bot"
          git config user.email "dispatch-bot@users.noreply.github.com"
          git add dispatch
          git diff --cached --quiet || git commit -m "Dispatch: $(TZ=America/Los_Angeles date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
