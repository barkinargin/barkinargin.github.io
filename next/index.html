<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project 04</title>
<meta name="description" content="The next project by Barkın. In the works.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one column teaser. Sign, headline, what it will do, a mock legend of the colour code. */
:root { --paper: #eef0f2; --ink: #1b1e23; --muted: #5b616b; --rule: #cfd3d8; --free: #1f9d55; --maybe: #d6a20b; --full: #c8352b;
  --display: "Newsreader", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #111317; --ink: #e8eaed; --muted: #9aa1ac; --rule: #2c3038; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #111317; --ink: #e8eaed; --muted: #9aa1ac; --rule: #2c3038; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); line-height: 1.6; }
.wrap { max-width: 680px; margin: 0 auto; padding: 28px 20px 64px; display: grid; gap: 28px; }
nav a { font-family: var(--mono); font-size: 13px; color: var(--muted); text-decoration: none; }
nav a:hover { text-decoration: underline; }
.sign { width: 88px; height: 88px; border-radius: 22px; background: linear-gradient(160deg, #3a3f47, #1b1e23); display: grid; place-items: center; position: relative; margin-top: 24px; }
.sign span { width: 50px; height: 50px; border: 4px solid #fff; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 28px; }
.sign i { position: absolute; top: 12px; right: 12px; width: 12px; height: 12px; border-radius: 50%; background: #3be38a; }
h1 { font-family: var(--display); font-size: clamp(36px, 7vw, 52px); line-height: 1.05; margin: 0; text-wrap: balance; }
.status { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; max-width: 60ch; }
.legend { display: grid; gap: 10px; border-top: 1px solid var(--rule); padding-top: 20px; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.bar { height: 10px; border-radius: 5px; }
a { color: inherit; }

/* arrival animation after launching from the home screen */
@view-transition { navigation: auto; }
@media (prefers-reduced-motion: no-preference) {
  body { animation: enter 0.55s cubic-bezier(.16,1,.3,1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="/">← Home</a></nav>
  <div class="status">Project 04 · London Eye</div>
  <h1>The next one is in the works.</h1>
  <p>Something new is being built. Check back soon, or open one of the live projects in the meantime.</p>
  <p><a href="/dispatch/">The Morning Dispatch</a> · <a href="/sport/">Dispatch Sport</a> · <a href="/parking/">Find Me a Parking Spot</a></p>
</div>
</body>
</html>
